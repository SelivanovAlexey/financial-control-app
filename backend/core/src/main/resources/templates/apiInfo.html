<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{openapi.title}">API</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="96x96">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">


    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #fff;
            color: #1a1a1a;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .box {
            width: 100%;
            max-width: 480px;
            padding: 40px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }

        .status {
            color: #059669;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #10b981;
            border-radius: 50%;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 12px 0;
            font-weight: 700;
            letter-spacing: -0.025em;
        }

        p {
            color: #4b5563;
            font-size: 15px;
            line-height: 1.5;
            margin: 0 0 32px 0;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            border: 1px solid #d1d5db;
            padding: 10px;
            border-radius: 6px;
            color: #1a1a1a;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            transition: all 0.1s;
        }

        .btn:hover {
            background: #f9fafb;
            border-color: #9ca3af;
        }

        .health {
            grid-column: span 2;
            background: #1a1a1a;
            color: #fff;
            border: none;
        }

        .health:hover {
            background: #000;
        }

        .notice {
            font-size: 13px;
            color: #9ca3af;
            padding: 12px;
            border: 1px dashed #d1d5db;
            border-radius: 6px;
            text-align: center;
            grid-column: span 2;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <div class="box">
        <img src="/logo.png" alt="Logo" style="width: 48px; height: 48px; margin-bottom: 8px; border-radius: 8px;">
        <div class="status">
            <span class="dot"></span>
            <span th:text="${status} + ' ' + #{api.portal.status_prefix} + ${version}">UP v1.0.0</span>
        </div>
        <h1 th:text="#{openapi.title}">API Title</h1>
        <p th:text="#{openapi.description}">API Description</p>

        <div class="grid">
            <div th:if="${!apiDocsEnabled}" class="notice" th:text="#{api.portal.docs_restricted}">
                Documentation is restricted in this environment.
            </div>

            <th:block th:if="${apiDocsEnabled}">
                <a th:href="${docs_swagger}" class="btn" th:text="#{api.portal.btn_swagger}">Swagger</a>
                <a th:href="${docs_scalar}" class="btn" th:text="#{api.portal.btn_scalar}">Scalar</a>
                <a th:href="${api_json}" class="btn" th:text="#{api.portal.btn_openapi}">OpenAPI spec</a>
            </th:block>

            <a th:href="${health}" class="btn health" th:text="#{api.portal.btn_health}">Service Health</a>
        </div>
    </div>
</body>

</html>
